name: "build"

on:
    # Pushes to pull request branches are covered by pull_request, so a push trigger without a filter would run
    # every job twice. The patterns match version branches (2.3.x, 3.x) but not topic branches like fix-2.3.x
    push:
        branches:
            - "[0-9]+.x"
            - "[0-9]+.[0-9]+.x"
    pull_request: ~
    workflow_dispatch: ~

jobs:
    backwards-compatibility:
        runs-on: "ubuntu-latest"
        if: "github.event_name == 'pull_request'"
        steps:
            -   uses: "setono/sylius-plugin/backwards-compatibility@v2"
    
    coding-standards:
        runs-on: "ubuntu-latest"
        steps:
            -   uses: "setono/sylius-plugin/coding-standards@v2"
    
    dependency-analysis:
        runs-on: "ubuntu-latest"
        strategy:
            fail-fast: false
            matrix:
                php-version: ["8.3", "8.4", "8.5"]
                dependencies: ["lowest", "highest"]
                symfony: ["~6.4.0", "~7.4.0"]
        steps:
            -   uses: "setono/sylius-plugin/dependency-analysis@v2"
                with:
                    php-version: "${{ matrix.php-version }}"
                    dependencies: "${{ matrix.dependencies }}"
                    symfony: "${{ matrix.symfony }}"
    
    static-code-analysis:
        runs-on: "ubuntu-latest"
        strategy:
            fail-fast: false
            matrix:
                php-version: ["8.3", "8.4", "8.5"]
                dependencies: ["lowest", "highest"]
                symfony: ["~6.4.0", "~7.4.0"]
        steps:
            -   uses: "setono/sylius-plugin/static-code-analysis@v2"
                with:
                    php-version: "${{ matrix.php-version }}"
                    dependencies: "${{ matrix.dependencies }}"
                    symfony: "${{ matrix.symfony }}"
    
    unit-tests:
        runs-on: "ubuntu-latest"
        strategy:
            fail-fast: false
            matrix:
                php-version: ["8.3", "8.4", "8.5"]
                dependencies: ["lowest", "highest"]
                symfony: ["~6.4.0", "~7.4.0"]
        steps:
            -   uses: "setono/sylius-plugin/unit-tests@v2"
                with:
                    php-version: "${{ matrix.php-version }}"
                    dependencies: "${{ matrix.dependencies }}"
                    symfony: "${{ matrix.symfony }}"
                    testsuite: "unit"
    
    functional-tests:
        runs-on: "ubuntu-latest"
        strategy:
            fail-fast: false
            matrix:
                php-version: ["8.3", "8.4", "8.5"]
                dependencies: ["lowest", "highest"]
                symfony: ["~6.4.0", "~7.4.0"]
        steps:
            -   uses: "setono/sylius-plugin/functional-tests@v2"
                with:
                    php-version: "${{ matrix.php-version }}"
                    dependencies: "${{ matrix.dependencies }}"
                    symfony: "${{ matrix.symfony }}"
                    # The action defaults to Node 20, which is end of life and which @sylius-ui/admin 2.3 rejects
                    # (it requires ^22.13.0 || >=24.0). Sylius runs its own frontend builds on Node 24
                    node-version: "24"
                    testsuite: "functional"
    
    mutation-tests:
        runs-on: "ubuntu-latest"
        steps:
            -   uses: "setono/sylius-plugin/mutation-tests@v2"
                with:
                    stryker-dashboard-api-key: "${{ secrets.STRYKER_DASHBOARD_API_KEY }}"
    
    code-coverage:
        runs-on: "ubuntu-latest"
        steps:
            -   uses: "setono/sylius-plugin/code-coverage@v2"
                with:
                    symfony: "~7.4.0"
                    # Builds the test application's assets like the functional tests, so it needs the same Node version
                    node-version: "24"
                    codecov-token: "${{ secrets.CODECOV_TOKEN }}"
