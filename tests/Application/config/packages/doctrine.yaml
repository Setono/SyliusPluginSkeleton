parameters:
    # Adds a fallback DATABASE_URL if the env var is not set.
    # This allows you to run cache:warmup even if your
    # environment variables are not available yet.
    # You should not need to change this value.
    env(DATABASE_URL): ''

doctrine:
    dbal:
        driver: 'pdo_mysql'
        server_version: '5.7'
        charset: UTF8

        url: '%env(resolve:DATABASE_URL)%'

        # dama/doctrine-test-bundle needs savepoints for the transactions nested in each test's transaction, and its
        # container won't compile without them. DBAL 4 always uses savepoints, but Sylius 2.2 is on DBAL 3, where they
        # are opt-in. Remove this once Sylius requires DBAL 4, where DoctrineBundle deprecates the key
        use_savepoints: true

when@prod:
    doctrine:
        orm:
            metadata_cache_driver:
                type: service
                id: doctrine.system_cache_provider
            query_cache_driver:
                type: service
                id: doctrine.system_cache_provider
            result_cache_driver:
                type: service
                id: doctrine.result_cache_provider

    services:
        doctrine.result_cache_provider:
            class: Symfony\Component\Cache\DoctrineProvider
            public: false
            arguments:
                - '@doctrine.result_cache_pool'
        doctrine.system_cache_provider:
            class: Symfony\Component\Cache\DoctrineProvider
            public: false
            arguments:
                - '@doctrine.system_cache_pool'

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
